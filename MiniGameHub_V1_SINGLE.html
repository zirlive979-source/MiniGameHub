<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniGame Hub V1</title>
<style>
:root{--bg:#090b12;--panel:#111522;--panel2:#171c2b;--text:#f5f7ff;--muted:#9aa5bd;--a:#65f5d2;--b:#8e7dff;--danger:#ff6384}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#18213b 0,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#090b12e8;backdrop-filter:blur(12px);border-bottom:2px solid #262d40}
nav{max-width:1200px;margin:auto;padding:14px 18px;display:flex;gap:12px;align-items:center}.brand{font-weight:1000;font-size:22px;letter-spacing:-1px}.brand span{color:var(--a)}.navbtn{border:2px solid #30384e;background:var(--panel);color:#fff;padding:8px 12px;font-weight:800}
main{max-width:1200px;margin:auto;padding:25px 18px}.hero{border:3px solid #30384e;background:linear-gradient(135deg,#151b2c,#10131d);padding:28px;box-shadow:8px 8px 0 #05060a}.hero h1{font-size:clamp(34px,7vw,70px);margin:0 0 8px;line-height:.95}.hero h1 b{color:var(--a)}.hero p{color:var(--muted);max-width:700px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.controls input,.controls select{background:var(--panel);color:#fff;border:2px solid #30384e;padding:11px 13px;outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:var(--panel);border:2px solid #30384e;padding:16px;box-shadow:5px 5px 0 #05060a;transition:.15s}.card:hover{transform:translate(-2px,-2px);border-color:var(--a)}.emoji{font-size:34px}.card h3{margin:8px 0 3px}.card p{color:var(--muted);min-height:42px;margin:0 0 12px}.play{background:var(--a);border:2px solid #0b211c;color:#06110e;padding:9px 14px;font-weight:1000}.fav{float:right;background:none;border:0;color:#ffcf57;font-size:21px}.hidden{display:none!important}.gamebox{margin-top:20px;border:3px solid #30384e;background:var(--panel);padding:20px;min-height:450px}.gamehead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.gamehead h2{margin:0}.back{background:var(--panel2);color:#fff;border:2px solid #30384e;padding:9px 13px;font-weight:900}.scorebar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.pill{border:2px solid #30384e;padding:7px 10px;background:var(--panel2)}.area{display:grid;place-items:center;min-height:330px}.board{display:grid;gap:6px}.cell{width:70px;height:70px;background:#1b2233;border:2px solid #3b4660;color:#fff;font-size:32px;font-weight:1000}.bigbtn{padding:14px 20px;background:var(--a);border:2px solid #0b211c;font-weight:1000}.msg{color:var(--muted);text-align:center;margin:12px}.gamegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:7px;max-width:600px;width:100%}.gamegrid button{aspect-ratio:1;background:#1b2233;color:#fff;border:2px solid #35405a;font-weight:900}.list{padding-left:20px;color:var(--muted)}footer{text-align:center;color:#66718a;padding:35px}
@media(max-width:500px){.cell{width:58px;height:58px}.hero{padding:20px}}
</style></head>
<body>
<header class="top"><nav><div class="brand">MINI<span>GAME</span> HUB</div><button class="navbtn" onclick="showHome()">🎮 Games</button><button class="navbtn" onclick="showScores()">🏆 Scores</button></nav></header>
<main>
<section id="home">
<div class="hero"><h1>30 GAMES.<br><b>ONE HUB.</b></h1><p>Game arcade ringan berbasis HTML, CSS, dan JavaScript. Main langsung tanpa login, skor tersimpan di perangkatmu.</p></div>
<div class="controls"><input id="search" placeholder="🔎 Cari game..." oninput="renderGames()"><select id="cat" onchange="renderGames()"><option value="">Semua kategori</option><option>Arcade</option><option>Puzzle</option><option>Classic</option><option>Quick</option><option>Cards</option><option>Strategy</option></select></div>
<div id="games" class="grid"></div>
</section>
<section id="play" class="hidden"><div class="gamebox"><div class="gamehead"><h2 id="gameTitle"></h2><button class="back" onclick="showHome()">← Kembali</button></div><div class="scorebar"><div class="pill">🏆 Skor: <b id="score">0</b></div><div class="pill">⭐ Best: <b id="best">0</b></div></div><div id="gameArea" class="area"></div></div></section>
<section id="scores" class="hidden"><div class="gamebox"><h2>🏆 High Scores</h2><div id="scoreList"></div></div></section>
</main><footer>MiniGame Hub V1 • 30 mini games • Local score system</footer>
<script>
const GAMES=window.GAMES||[];let current=null,score=0;
const key=id=>'mgh_best_'+id;
function renderGames(){let q=document.querySelector('#search').value.toLowerCase(),c=document.querySelector('#cat').value;document.querySelector('#games').innerHTML=GAMES.filter(g=>(!q||g.name.toLowerCase().includes(q))&&(!c||g.cat===c)).map(g=>`<article class="card"><button class="fav" onclick="event.stopPropagation();fav('${g.id}')">${localStorage.getItem('fav_'+g.id)?'★':'☆'}</button><div class="emoji">${g.icon}</div><h3>${g.name}</h3><p>${g.desc}</p><button class="play" onclick="openGame('${g.id}')">MAIN →</button></article>`).join('')}
function fav(id){let k='fav_'+id;localStorage.getItem(k)?localStorage.removeItem(k):localStorage.setItem(k,1);renderGames()}
function openGame(id){current=GAMES.find(x=>x.id===id);score=0;document.querySelector('#home').classList.add('hidden');document.querySelector('#scores').classList.add('hidden');document.querySelector('#play').classList.remove('hidden');document.querySelector('#gameTitle').textContent=current.icon+' '+current.name;document.querySelector('#score').textContent=0;document.querySelector('#best').textContent=localStorage.getItem(key(id))||0;current.init(document.querySelector('#gameArea'),setScore)}
function setScore(n){score=Math.max(0,Math.floor(n));document.querySelector('#score').textContent=score;let b=+localStorage.getItem(key(current.id))||0;if(score>b){localStorage.setItem(key(current.id),score);document.querySelector('#best').textContent=score}}
function showHome(){document.querySelector('#play').classList.add('hidden');document.querySelector('#scores').classList.add('hidden');document.querySelector('#home').classList.remove('hidden');renderGames()}
function showScores(){document.querySelector('#home').classList.add('hidden');document.querySelector('#play').classList.add('hidden');document.querySelector('#scores').classList.remove('hidden');let rows=GAMES.map(g=>({n:g.name,s:+localStorage.getItem(key(g.id))||0})).sort((a,b)=>b.s-a.s);document.querySelector('#scoreList').innerHTML='<ol class="list">'+rows.map(x=>`<li><b>${x.n}</b> — ${x.s}</li>`).join('')+'</ol>'}
renderGames();
</script></body></html>
